<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store – Northwild Mooncrest</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="layout.css">
</head>

<body>

<div data-include="header.html"></div>

<section class="store-page">
    <h1>Store</h1>

    <p>Welcome to the Northwild Mooncrest store. Cart, checkout, and product listings will be added soon.</p>

    <button class="cart-btn">Open Cart</button>

    <div class="cart-drawer">
        <h2>Your Cart</h2>
        <p>No items yet.</p>
    </div>

    <div class="product-list">
        <div class="product">
            <p>Sample Print</p>
            <button class="add-to-cart" data-item="Sample Print">Add to Cart</button>
        </div>
    </div>
</section>

<div data-include="footer.html"></div>

<script src="store.js"></script>
<script src="scripts.js"></script>

</body>
</html>
