<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Northwild Social Feed – Northwild Mooncrest</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b1118;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 20px 40px;
            background: rgba(10, 15, 20, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
        }

        .brand-logo-icon {
            height: 32px;
        }

        .feed-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .post-card {
            background: #111a22;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .post-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1c2733;
        }

        .post-user {
            font-weight: 600;
        }

        .post-image {
            width: 100%;
            border-radius: 10px;
            margin: 16px 0;
        }

        .post-actions {
            display: flex;
            gap: 20px;
            margin-top: 12px;
        }

        .action-btn {
            cursor: pointer;
            opacity: 0.85;
        }

        .action-btn:hover {
            opacity: 1;
        }

        .post-caption {
            margin-top: 10px;
            opacity: 0.85;
        }
    </style>
</head>

<body>

<header>
    <a href="/" class="brand-logo">
        <img src="northwild_mooncrest_icon_light.svg" class="brand-logo-icon">
        <span>Northwild Mooncrest</span>
    </a>
</header>

<div class="feed-container">

    <!-- Example Post -->
    <div class="post-card">
        <div class="post-header">
            <div class="post-avatar"></div>
            <div class="post-user">northwild_official</div>
        </div>

        <img src="images/featured2.jpg" class="post-image">

        <div class="post-actions">
            <span class="action-btn">❤️ Like</span>
            <span class="action-btn">💬 Comment</span>
            <span class="action-btn">🔗 Share</span>
        </div>

        <div class="post-caption">
            Wilderness mornings in northern Minnesota.  
            Atmospheric, quiet, and full of life.
        </div>
    </div>

</div>

</body>
</html>
