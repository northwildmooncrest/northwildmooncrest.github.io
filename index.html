  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* Page fade-in and fade-out */
    body {
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      font-family: 'Lora', serif;
      margin: 0;
      padding: 0;
      color: white;
      text-align: center;
      background-image: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: rgba(0,0,0,0.65);
      background-blend-mode: darken;
    }

    body.fade-in {
      opacity: 1;
    }

    .fade-out {
      opacity: 0;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 20px;
      font-size: 18px;
    }

    nav a {
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    nav a:hover {
      opacity: 0.7;
      text-shadow: 0 0 12px rgba(255,255,255,0.4);
    }

    /* Hero Section */
    .hero {
      margin-top: 120px;
      animation: heroFade 1.4s ease-out;
    }

    @keyframes heroFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 64px;
      text-shadow: 0px 0px 18px rgba(255,255,255,0.25);
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 22px;
      opacity: 0.85;
      max-width: 700px;
      margin: 0 auto;
    }

    /* Button */
    .explore-button {
      margin-top: 40px;
      padding: 14px 32px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      background: #ffffff22;
      color: white;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: 0.25s;
    }

    .explore-button:hover {
      background: #ffffff33;
      box-shadow: 0 0 12px rgba(255,255,255,0.25);
    }

    /* Social Icons */
    .social-icons {
      margin-top: 80px;
      display: flex;
      justify-content: center;
      gap: 22px;
    }

    .social-icons a {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .social-icons.show a {
      opacity: 1;
      transform: translateY(0);
    }

    .social-icons a svg {
      width: 30px;
      height: 30px;
      fill: white;
      opacity: 0.85;
      transition: 0.2s;
    }

    .social-icons a:hover svg {
      opacity: 1;
      transform: scale(1.1);
    }
  </style>

  <script>
    /* Fade-in on load */
    window.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("fade-in");
    });

    /* Page fade-out on navigation */
    document.querySelectorAll("a").forEach(link => {
      const url = link.getAttribute("href");
      if (url && url.endsWith(".html")) {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          document.body.classList.add("fade-out");
          setTimeout(() => {
            window.location.href = url;
          }, 400);
        });
      }
    });

    /* Parallax background */
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 10;
      const y = (e.clientY / window.innerHeight) * 10;
      document.body.style.backgroundPosition = `${x}% ${y}%`;
    });

    /* Social icons fade-in */
    window.addEventListener('scroll', () => {
      const icons = document.querySelector('.social-icons');
      if (window.scrollY > 50) {
        icons.classList.add('show');
      } else {
        icons.classList.remove('show');
      }
    });
  </script>
</head>
