<head>
  <title>Northwild Mooncrest™</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body {
      font-family: 'Lora', serif;
      margin: 0;
      padding: 0;
      color: white;
      text-align: center;
      background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80');

      background-position: center;
      background-attachment: fixed;
      background-color: rgba(0,0,0,0.65);
      background-blend-mode: darken;
      padding-top: 80px;
      animation: fadeIn 1.2s ease-out;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0px 0px 18px rgba(255,255,255,0.25);
      animation: fadeIn 1.6s ease-out;
    }

    .signature-line {
      font-family: 'Playfair Display', serif;

      opacity: 0.85;

      color: white;
      text-decoration: none;
      font-size: 18px;

      animation: fadeIn 2s ease-out;
    }

    a:hover {

    }

    }
