<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Metadata -->
    <meta name="description" content="Cinematic nature photography and exploration. Northwild Mooncrest™ brand website.">
    <meta property="og:title" content="Northwild Mooncrest™">
    <meta property="og:description" content="Cinematic nature photography and exploration.">

    <!-- Bing Webmaster Tools Verification -->
    <meta name="msvalidate.01" content="7FEFF593E9D1168668DFA838E1428AB3" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="northwild_mooncrest_primary_logo.ico">

    <title>Northwild Mooncrest™ — Cinematic Nature Photography</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: 'Playfair Display', serif;
            text-align: center;
        }

        header {
            padding: 40px 20px;
        }

        header img {
            width: 160px;
            height: auto;
            margin-bottom: 20px;
        }

        nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        nav a:hover {
            opacity: 0.7;
        }

        h1 {
            font-size: 2.4rem;
            margin-top: 20px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.85;
            margin-top: 10px;
        }

        /* Permission Popup */
        #permission-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.95);
            padding: 20px;
            border-radius: 12px;
            width: 260px;
            display: none;
            text-align: left;
            border: 1px solid #444;
        }

        #permission-popup h3 {
            margin-top: 0;
            font-size: 1.2rem;
        }

        #permission-popup button {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #permission-popup button:hover {
            background: #666;
        }
    </style>
</head>

<body>

<header>
    <img src="northwild_mooncrest_primary_logo.png" alt="Northwild Mooncrest Logo">
    <h1>Northwild Mooncrest™</h1>
    <p>Cinematic Nature Photography & Wilderness Exploration</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="printshop.html">Print Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<!-- Permission Popup -->
<div id="permission-popup">
    <h3>Enable Enhanced Experience</h3>
    <p>Allow location, microphone, and motion access for interactive features.</p>
    <button onclick="requestPermissions()">Enable</button>
</div>

<script>
    function requestPermissions() {
        // Location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(() => {
                console.log("Location granted");
            });
        }

        // Microphone
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(() => console.log("Microphone granted"))
            .catch(() => console.log("Microphone denied"));

        // Motion Sensors
        if (typeof DeviceMotionEvent.requestPermission === "function") {
            DeviceMotionEvent.requestPermission().then(response => {
                console.log("Motion permission:", response);
            });
        }

        document.getElementById("permission-popup").style.display = "none";
    }

    // Show popup after delay
    setTimeout(() => {
        document.getElementById("permission-popup").style.display = "block";
    }, 2000);
</script>

</body>
</html>
