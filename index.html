    <style>
        :root {
            --text-main: #ffffff;
            --text-soft: #cfd8e3;
            --accent: #9fd6ff;
            --overlay-dark: rgba(0, 0, 0, 0.35);
            --overlay-darker: rgba(0, 0, 0, 0.75);
            --glass-bg: rgba(10, 15, 25, 0.9);
            --glass-border: rgba(159, 214, 255, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Playfair Display", serif;
            color: var(--text-main);
            background: #000;
            overflow-x: hidden;
        }

        /* Background Breathing Animation */
        @keyframes bgBreath {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        /* FIXED — Background image always visible */
        .bg-image {
            position: fixed;
            inset: 0;
            background-image: url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1920&q=80");
            background-size: cover;
            background-position: center;
            filter: blur(6px) brightness(0.55);
            z-index: -10;
            animation: bgBreath 40s ease-in-out infinite alternate;
        }

        /* FIXED — Overlay no longer hides everything */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: -9;
        }

        /* FIXED — Starfield visible again */
        .starfield {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -8;
            background: radial-gradient(circle at 30% 20%, rgba(90, 200, 140, 0.25), transparent 70%),
                        radial-gradient(circle at 70% 80%, rgba(120, 180, 255, 0.22), transparent 70%);
            animation: starDrift 120s linear infinite;
        }

        @keyframes starDrift {
            0% { transform: translateY(0); opacity: 0.55; }
            100% { transform: translateY(-40px); opacity: 0.65; }
        }

        /* FIXED — Aurora layer visible again */
        .aurora-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -7;
            background:
                radial-gradient(circle at 25% 80%, rgba(90, 200, 140, 0.28), transparent 60%),
                radial-gradient(circle at 75% 20%, rgba(120, 180, 255, 0.22), transparent 60%);
            filter: blur(80px);
        }

        /* Logo breathing + glow */
        .hero-logo {
            width: 180px;
            height: auto;
            animation:
                logoGlow 8s ease-in-out infinite alternate,
                logoBreath 10s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% { filter: drop-shadow(0 0 12px rgba(159, 214, 255, 0.35)); }
            50% { filter: drop-shadow(0 0 22px rgba(180, 120, 255, 0.55)); }
            100% { filter: drop-shadow(0 0 18px rgba(159, 214, 255, 0.45)); }
        }

        @keyframes logoBreath {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        /* Scroll Shadows */
        .scroll-shadow-top,
        .scroll-shadow-bottom {
            position: fixed;
            left: 0;
            width: 100%;
            height: 60px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .scroll-shadow-top {
            background: linear-gradient(to bottom, rgba(90, 200, 140, 0.25), transparent);
        }

        .scroll-shadow-bottom {
            bottom: 0;
            background: linear-gradient(to top, rgba(120, 180, 255, 0.22), transparent);
        }

        header {
            text-align: center;
            padding: 80px 20px 40px;
        }

        header h1 {
            margin-top: 24px;
            font-size: 42px;
            letter-spacing: 1.2px;
        }

        header p {
            margin-top: 10px;
            font-size: 20px;
            color: var(--text-soft);
        }

        nav {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            gap: 26px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 20px;
            letter-spacing: 0.6px;
            position: relative;
            padding-bottom: 4px;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.25s ease-out;
        }

        nav a:hover::after {
            width: 100%;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 80px;
            text-align: center;
        }

        .tagline {
            font-size: 18px;
            color: var(--text-soft);
            margin-bottom: 18px;
        }

        /* Section Dividers */
        .section-divider {
            width: 100%;
            height: 2px;
            margin: 40px 0;
            background: linear-gradient(
                to right,
                rgba(90, 200, 140, 0.35),
                rgba(120, 180, 255, 0.35)
            );
            filter: blur(1px);
            border-radius: 999px;
        }

        /* Ask Northwild Chat Bubble — FIXED */
        .chat-toggle {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 0%, rgba(90, 200, 140, 0.85), rgba(10, 15, 25, 0.98));
            border: 1px solid rgba(159, 214, 255, 0.6);
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
            animation: chatPulse 8s ease-in-out infinite alternate;
        }

        .chat-toggle-label {
            font-size: 14px;
            letter-spacing: 0.6px;
        }

        .chat-toggle-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(5, 10, 18, 0.9);
        }

        .chat-toggle-icon img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        @keyframes chatPulse {
            0% { transform: translateY(0); }
            100% { transform: translateY(-2px); }
        }

        /* Chat Panel — FIXED */
        .chat-panel {
            position: fixed;
            right: 24px;
            bottom: 80px;
            width: 320px;
            max-height: 420px;
            display: none;
            flex-direction: column;
            border-radius: 18px;
            overflow: hidden;
            z-index: 29;
            background: radial-gradient(circle at 0% 0%, rgba(90, 200, 140, 0.55), rgba(10, 15, 25, 0.98));
            border: 1px solid rgba(159, 214, 255, 0.6);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
        }

        .chat-header {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(159, 214, 255, 0.35);
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header-logo {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(5, 10, 18, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-header-logo img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .chat-header-title {
            font-size: 14px;
            letter-spacing: 0.6px;
        }

        .chat-header-sub {
            font-size: 11px;
            color: var(--text-soft);
        }

        .chat-header-close {
            font-size: 16px;
            cursor: pointer;
            color: var(--text-soft);
        }

        .chat-body {
            padding: 10px 12px;
            flex: 1;
            overflow-y: auto;
            font-size: 13px;
            color: var(--text-main);
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        .chat-message {
            margin-bottom: 8px;
            max-width: 90%;
        }

        .chat-message.system {
            color: var(--accent);
        }

        .chat-message.user {
            align-self: flex-end;
            text-align: right;
        }

        .chat-input-row {
            padding: 10px 12px;
            border-top: 1px solid rgba(159, 214, 255, 0.35);
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            padding: 6px 8px;
            border-radius: 999px;
            border: 1px solid rgba(159, 214, 255, 0.4);
            background: rgba(5, 10, 18, 0.95);
            color: var(--text-main);
            font-size: 13px;
        }

        .chat-send-btn {
            padding: 6px 10px;
            border-radius: 999px;
            border: none;
            background: var(--accent);
            color: #020611;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Footer */
        footer {
            position: relative;
            padding: 40px 20px 30px;
            text-align: center;
            color: var(--text-soft);
            font-size: 14px;
            overflow: hidden;
        }

        .footer-aurora {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 120%, rgba(90, 200, 140, 0.22), transparent 70%),
                radial-gradient(circle at 50% 140%, rgba(120, 180, 255, 0.18), transparent 75%);
            filter: blur(60px);
            pointer-events: none;
            z-index: -1;
        }

        .footer-line {
            width: 100%;
            height: 1px;
            background: rgba(159, 214, 255, 0.35);
            margin-bottom: 24px;
        }

        .footer-columns {
            max-width: 900px;
            margin: 0 auto 24px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
            text-align: center;
        }

        .footer-column-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            letter-spacing: 0.6px;
        }

        .footer-link {
            display: block;
            margin-bottom: 4px;
            color: var(--text-soft);
            text-decoration: none;
            font-size: 13px;
        }

        .footer-link:hover {
            color: var(--accent);
        }

        .footer-language-select {
            margin-top: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--glass-border);
            background: rgba(5, 10, 18, 0.9);
            color: var(--text-soft);
            font-size: 13px;
        }

        .footer-experience {
            margin-bottom: 18px;
        }

        .footer-experience a {
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
        }

        .footer-experience a:hover {
            text-decoration: underline;
        }

        .footer-logo {
            width: 40px;
            opacity: 0.85;
            margin-bottom: 8px;
        }

        .footer-studio {
            margin-bottom: 4px;
        }

        .footer-copy {
            margin-bottom: 2px;
        }
    </style>
</head>
