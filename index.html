<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northwild Mooncrest</title>

  <!-- Global Styles -->
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="utilities.css">

  <!-- Component Styles -->
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="hero.css">
  <link rel="stylesheet" href="featured.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="stylesheet" href="chat.css">
</head>

<body>

  <!-- Homepage Sections -->
  <div data-include="header.html"></div>
  <div data-include="hero.html"></div>
  <div data-include="featured.html"></div>
  <div data-include="footer.html"></div>

  <!-- AI Chat Orb -->
  <div data-include="chat.html"></div>

  <!-- Modular Loader -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("[data-include]").forEach(async (el) => {
        const file = el.getAttribute("data-include");
        try {
          const response = await fetch(file);
          if (!response.ok) throw new Error(`Failed to load ${file}`);
          el.innerHTML = await response.text();
        } catch (err) {
          console.error(err);
          el.innerHTML = `<div style="color:red;">Error loading ${file}</div>`;
        }
      });
    });
  </script>

  <!-- JS Modules -->
  <script src="header.js"></script>
  <script src="hero.js"></script>
  <script src="featured.js"></script>
  <script src="footer.js"></script>
  <script src="chat.js"></script>

  <!-- Load dropdown.js AFTER all includes finish -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Wait for the include loader to finish inserting header.html
      setTimeout(() => {
        const script = document.createElement("script");
        script.src = "dropdown.js";
        document.body.appendChild(script);
      }, 150); // ensures header is fully loaded
    });
  </script>

</body>
</html>
