<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northwild Mooncrest™ — Cinematic Nature Photography</title>

    <!-- FAVICONS -->
    <link rel="icon" type="image/svg+xml" href="northwild_mooncrest_primary_logo.svg">
    <link rel="icon" type="image/png" href="northwild_mooncrest_primary_logo.png">
    <link rel="icon" type="image/x-icon" href="northwild_mooncrest_primary_logo.ico">

    <!-- SEO META -->
    <meta name="description" content="Northwild Mooncrest™ — Cinematic Nature Photography by John Robert. Northern landscapes, wilderness imagery, and outdoor storytelling.">
    <meta name="keywords" content="Northwild Mooncrest, John Robert, cinematic nature photography, wilderness photography, outdoor photography, northern landscapes, nature photographer Minnesota">
    <meta name="author" content="John Robert">

    <!-- OPEN GRAPH -->
    <meta property="og:title" content="Northwild Mooncrest™ — Cinematic Nature Photography">
    <meta property="og:description" content="Cinematic nature photography capturing northern wilderness, moonlit landscapes, and outdoor storytelling.">
    <meta property="og:image" content="northwild_mooncrest_primary_logo.png">
    <meta property="og:url" content="https://northwildmooncrest.github.io/index.html">
    <meta property="og:type" content="website">

    <!-- MOBILE THEME -->
    <meta name="theme-color" content="#0a0a0a">

    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

    <!-- STYLES -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(120deg, #0a0a0a, #1a1a1a, #0a0a0a);
            background-size: 400% 400%;
            animation: breathing 18s ease-in-out infinite;
            color: #ffffff;
            text-align: center;
        }

        @keyframes breathing {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            padding: 120px 20px 80px;
            animation: fadein 2s ease;
        }

        @keyframes fadein {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-small {
            width: 110px;
            opacity: 0.85;
            margin-bottom: 25px;
            animation: fadein 2.2s ease;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.8rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 0;
        }

        nav {
            margin-top: 60px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 18px;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 0.6;
        }

        .scroll-indicator {
            margin-top: 60px;
            font-size: 0.9rem;
            opacity: 0.7;
            animation: fadein 3s ease;
        }

        footer {
            margin-top: 120px;
            padding: 40px 20px;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .footer-divider {
            width: 60%;
            height: 1px;
            background-color: rgba(255,255,255,0.15);
            margin: 0 auto 25px auto;
        }

        footer a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 10px;
        }

        footer a:hover {
            opacity: 0.6;
        }

        /* COOKIE POPUP — PREMIUM VERSION */
        #cookie-popup {
            position: fixed;
            bottom: 60px; /* raised above footer */
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(20, 20, 20, 0.65); /* semi-transparent */
            backdrop-filter: blur(6px); /* cinematic blur */
            color: #fff;
            padding: 14px 20px; /* smaller footprint */
            border-radius: 10px;
            font-size: 0.9rem;
            box-shadow: 0 0 12px rgba(0,0,0,0.45);
            display: none;
            z-index: 9999;
            text-align: center;
            max-width: 320px;
        }

        #cookie-popup button {
            margin-top: 10px;
            background-color: #ffffff;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <header>
        <img src="northwild_mooncrest_primary_logo.svg" alt="Northwild Mooncrest Logo" class="logo-small">

        <h1>Northwild Mooncrest™</h1>
        <h2>Cinematic Nature Photography</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="printshop.html">Print Shop</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="scroll-indicator">▼ Scroll</div>
    </header>

    <div class="footer-divider"></div>

    <footer>
        © 2026 Northwild Mooncrest™ — All Rights Reserved  
        <br><br>
        <a href="terms.html">Terms</a> • 
        <a href="privacy.html">Privacy</a> • 
        <a href="cookies.html">Cookies</a> • 
        <a href="disclaimer.html">Disclaimer</a>
        <br><br>
        Site by John Robert
    </footer>

    <!-- COOKIE POPUP -->
    <div id="cookie-popup">
        This website uses cookies to ensure you get the best experience.  
        <a href="cookies.html" style="color:#fff; text-decoration:underline;">Learn more</a>
        <button id="accept-cookies">Accept</button>
    </div>

    <script>
        window.addEventListener('load', function() {
            if (!localStorage.getItem('cookiesAccepted')) {
                document.getElementById('cookie-popup').style.display = 'block';
            }
        });

        document.getElementById('accept-cookies').addEventListener('click', function() {
            localStorage.setItem('cookiesAccepted', 'true');
            document.getElementById('cookie-popup').style.display = 'none';
        });
    </script>

</body>
</html>
