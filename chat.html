<!-- ---------------------------------------------------------
     NORTHWILD MOONCREST — CHAT ORB + PANEL (MODULAR VERSION)
---------------------------------------------------------- -->

<div id="chat-orb" class="chat-orb">
    <div class="chat-orb-inner">
        <span class="chat-orb-icon">✦</span>
    </div>
</div>

<div id="chat-panel" class="chat-panel">
    <div class="chat-panel-header">
        <h3>Northwild Mooncrest AI</h3>
        <span id="chat-close" class="chat-close">×</span>
    </div>

    <div id="chat-messages" class="chat-messages">
        <!-- Messages will be injected by chat.js -->
    </div>

    <div class="chat-input-area">
        <input id="chat-input" type="text" placeholder="Type a message...">
        <button id="chat-send" class="chat-send">Send</button>
    </div>
</div>
