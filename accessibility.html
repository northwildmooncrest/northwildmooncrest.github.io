<!-- ---------------------------------------------------------
     NORTHWILD MOONCREST — ACCESSIBILITY MODULE (WCAG 2.2)
---------------------------------------------------------- -->

<!-- Skip Navigation -->
<a href="#main-content" class="skip-nav">Skip to main content</a>

<!-- ARIA Landmarks -->
<div role="banner" aria-label="Site Header"></div>
<div role="navigation" aria-label="Primary Navigation"></div>
<div role="main" id="main-content" aria-label="Main Content"></div>
<div role="contentinfo" aria-label="Site Footer"></div>

<!-- Screen Reader Only Class -->
<style>
    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
    }

    /* Skip Nav Styling */
    .skip-nav {
        position: absolute;
        top: -40px;
        left: 0;
        background: #ffffff;
        color: #000;
        padding: 8px 16px;
        z-index: 999;
        transition: top 0.3s ease;
    }
    .skip-nav:focus {
        top: 0;
    }
</style>

<!-- Keyboard Focus Enhancements -->
<style>
    *:focus {
        outline: 3px solid #00bcd4;
        outline-offset: 4px;
    }
</style>
