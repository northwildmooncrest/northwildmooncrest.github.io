<!-- ---------------------------------------------------------
     NORTHWILD MOONCREST — COOKIE CONSENT BANNER (LEGAL REQUIRED)
---------------------------------------------------------- -->

<div id="cookie-banner" class="cookie-banner">
    <p>
        Northwild Mooncrest™ uses cookies to improve your experience, analyze site traffic,
        and provide essential functionality. By continuing, you accept our
        <a href="cookies.html">Cookie Policy</a>.
    </p>

    <button id="cookie-accept" class="cookie-accept">Accept</button>
</div>

<style>
    .cookie-banner {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #111;
        color: #fff;
        padding: 16px;
        text-align: center;
        font-size: 14px;
        z-index: 9999;
        border-top: 1px solid #333;
    }

    .cookie-banner a {
        color: #00bcd4;
        text-decoration: underline;
    }

    .cookie-accept {
        margin-left: 12px;
        padding: 8px 16px;
        background: #00bcd4;
        border: none;
        color: #000;
        cursor: pointer;
        border-radius: 4px;
    }
</style>

<script>
    document.getElementById("cookie-accept").onclick = function () {
        document.getElementById("cookie-banner").style.display = "none";
        localStorage.setItem("cookieConsent", "true");
    };

    if (localStorage.getItem("cookieConsent") === "true") {
        document.getElementById("cookie-banner").style.display = "none";
    }
</script>
