<!DOCTYPE html>
<html>
<head>
  <title>Contact — Northwild Mooncrest™</title>

  <!-- SEO Metadata -->
  <meta name="description" content="Contact Northwild Mooncrest™ — cinematic nature photography and wilderness storytelling.">
  <meta name="keywords" content="Northwild Mooncrest contact, nature photography, Minnesota photographer">

  <!-- OpenGraph -->
  <meta property="og:title" content="Contact — Northwild Mooncrest™">
  <meta property="og:description" content="Get in touch with Northwild Mooncrest™ for nature photography inquiries.">
  <meta property="og:image" content="northwild_mooncrest_primary_logo.png">
  <meta property="og:url" content="https://northwildmooncrest.github.io/contact.html">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="northwild_mooncrest_primary_logo.png">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* Page fade-in/out */
    body {
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      font-family: 'Lora', serif;
      margin: 0;
      padding: 40px;
      color: white;
      text-align: center;
      background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: rgba(0,0,0,0.65);
      background-blend-mode: darken;
    }

    body.fade-in { opacity: 1; }
    .fade-out { opacity: 0; }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      margin-bottom: 20px;
      text-shadow: 0px 0px 18px rgba(255,255,255,0.25);
    }

    .button-row {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .contact-button {
      padding: 12px 26px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #ffffff22;
      color: white;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: 0.25s;
    }

    .contact-button:hover {
      background: #ffffff33;
      box-shadow: 0 0 12px rgba(255,255,255,0.25);
    }

    /* NEW Copied animation (no movement) */
    #copied {
      position: fixed;
      bottom: 40px;
      right: 40px;
      background: rgba(255,255,255,0.15);
      padding: 12px 20px;
      border-radius: 6px;
      backdrop-filter: blur(6px);
      color: white;
      font-size: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #copied.show {
      opacity: 1;
    }

    /* Social icons (always visible) */
    .social-icons {
      margin-top: 50px;
      display: flex;
      justify-content: center;
      gap: 22px;
    }

    .social-icons a {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .social-icons a svg {
      width: 30px;
      height: 30px;
      fill: white;
      opacity: 0.85;
      transition: 0.2s;
    }

    .social-icons a:hover svg {
      opacity: 1;
      transform: scale(1.1);
    }
  </style>

  <script>
    /* Fade-in on load */
    window.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("fade-in");
    });

    /* Page fade-out on navigation */
    document.querySelectorAll("a").forEach(link => {
      const url = link.getAttribute("href");
      if (url && url.endsWith(".html")) {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          document.body.classList.add("fade-out");
          setTimeout(() => {
            window.location.href = url;
          }, 400);
        });
      }
    });

    /* NEW Copied animation (no layout shift) */
    function copyEmail() {
      navigator.clipboard.writeText('northwildmooncrest@outlook.com');

      const bubble = document.getElementById('copied');
      bubble.classList.add('show');

      setTimeout(() => bubble.classList.remove('show'), 1500);
    }

    /* Parallax background */
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 10;
      const y = (e.clientY / window.innerHeight) * 10;
      document.body.style.backgroundPosition = `${x}% ${y}%`;
    });
  </script>
</head>

<body>
  <h1>Contact</h1>

  <!-- Buttons -->
  <div class="button-row">
    <a href="mailto:northwildmooncrest@outlook.com">

    </a>

    <button class="contact-button" onclick="copyEmail()">Copy Email</button>

  <!-- Copied Notification -->

</html>
