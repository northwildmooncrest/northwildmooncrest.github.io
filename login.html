<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In – Northwild Mooncrest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", sans-serif;
            background: linear-gradient(to bottom, #0a1a33, #000000);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(0, 0, 0, 0.55);
            padding: 40px;
            border-radius: 14px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }

        .brand-icon {
            width: 70px;
            height: 70px;
            margin-bottom: 12px;
        }

        .brand-name {
            font-size: 1.3rem;
            letter-spacing: 0.08em;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            background: #111827;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        .input-field::placeholder {
            color: #9ca3af;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #1f3a78;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #2a4c9c;
        }

        .links {
            margin-top: 25px;
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .links a {
            color: #9bb5ff;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <img src="northwild_mooncrest_icon.svg" alt="Brand Icon" class="brand-icon">

        <div class="brand-name">Northwild Mooncrest</div>

        <form>
            <input type="email" class="input-field" placeholder="Email address">
            <input type="password" class="input-field" placeholder="Password">

            <button class="login-button">Sign In</button>
        </form>

        <div class="links">
            <div><a href="#">Forgot password?</a></div>
            <div style="margin-top: 8px;">
                <a href="signup.html">Create an account</a>
            </div>
        </div>

    </div>

</body>
</html>
