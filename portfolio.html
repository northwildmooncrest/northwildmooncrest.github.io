<!DOCTYPE html>
<html>
<head>
  <title>Portfolio — Northwild Mooncrest™</title>

  <!-- Favicon (your actual file name) -->
  <link rel="icon" type="image/png" href="northwild_mooncrest_primary_logo.png">
  <link rel="shortcut icon" href="northwild_mooncrest_primary_logo.png">
  <link rel="apple-touch-icon" href="northwild_mooncrest_primary_logo.png">
  <meta name="theme-color" content="#000000">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Lora', serif;
      margin: 0;
      padding: 40px;
      color: white;
      text-align: center;
      background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: rgba(0,0,0,0.65);
      background-blend-mode: darken;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      margin-bottom: 20px;
      text-shadow: 0px 0px 18px rgba(255,255,255,0.25);
    }

    p {
      font-size: 18px;
      opacity: 0.85;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .grid img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0px 0px 12px rgba(0,0,0,0.4);
      transition: 0.3s;
    }

    .grid img:hover {
      transform: scale(1.03);
      box-shadow: 0px 0px 18px rgba(255,255,255,0.25);
    }
  </style>
</head>

<body>
  <h1>Portfolio</h1>

  <p>
    A cinematic collection of nature photography — forests, storms, horizons, and the wild northern atmosphere.
  </p>

  <!-- Empty grid until you upload images -->
  <div class="grid">
    <!-- Example (you will replace these once you upload images)
    <img src="images/photo1.jpg" alt="Northwild Mooncrest Photo">
    <img src="images/photo2.jpg" alt="Northwild Mooncrest Photo">
    <img src="images/photo3.jpg" alt="Northwild Mooncrest Photo">
    -->
  </div>

</body>
</html>
